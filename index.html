<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1D5B43">
<meta name="robots" content="noindex">
<title>CFV Atelier</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icone-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CFV Atelier">
<link rel="stylesheet" href="css/app.css">
<script>
/* Plateforme : la marge haute du bandeau réseau n'est là que pour le flou de la
   Dynamic Island de l'iPhone. Posée avant le CSS pour éviter tout saut à l'ouverture. */
(function () {
  var ua = navigator.userAgent;
  var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  document.documentElement.dataset.plateforme = ios ? 'ios' : /Android/.test(ua) ? 'android' : 'autre';
  /* Zoom : iOS ignore user-scalable=no, on bloque le pincement et le double appui. */
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
  /* Le double appui est bloqué par « touch-action: manipulation » dans la feuille de style :
     le faire ici casserait les appuis rapprochés sur deux boutons différents. */
  document.addEventListener('touchmove', function (e) {
    if (e.touches.length > 1) e.preventDefault();   /* pincement */
  }, { passive: false });
})();
</script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app">
  <main id="vue" aria-live="polite"><div class="chargement">Chargement…</div></main>
</div>
<nav class="nav" id="nav" aria-label="Navigation principale" hidden></nav>
<noscript>Cette application a besoin de JavaScript.</noscript>
</body>
</html>
