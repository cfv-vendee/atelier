# Les projets Supabase gratuits sont mis en pause après une semaine sans activité.
# Cette tâche fait un appel léger deux fois par semaine pour garder l'appli disponible.
name: Garder la base active
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "https://rexnjgvqwdljhtafombh.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_1V9EEXVHJNxFWNF2CSWFwQ_u0Za0UgB" -H "Content-Type: application/json" -d '{}'
